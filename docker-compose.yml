version: '3.8'

services:
  # 1. MySQL Database Container
  db:
    image: mysql:8.0
    container_name: lawyerconnect_db
    restart: always
    environment:
      MYSQL_DATABASE: lawyerconnect_db
      MYSQL_ROOT_PASSWORD: rootpassword123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lawyerconnect_net

  # 2. Spring Boot Backend Container
  backend:
    build:
      context: ./BackEnd/lawyerConnect_backend
      dockerfile: Dockerfile
    container_name: lawyerconnect_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/lawyerconnect_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: rootpassword123
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    networks:
      - lawyerconnect_net

  # 3. Next.js Frontend Container
  frontend:
    build:
      context: ./lawyerconnect-frontend
      dockerfile: Dockerfile
    container_name: lawyerconnect_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    depends_on:
      - backend
    networks:
      - lawyerconnect_net

volumes:
  mysql_data:

networks:
  lawyerconnect_net:
    driver: bridge
