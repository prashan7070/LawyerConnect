name: LawyerConnect Frontend CI/CD Pipeline (Azure)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Validate Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lawyerconnect-frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd lawyerconnect-frontend
          npm ci

      - name: Run Type Checking & Build Test
        run: |
          cd lawyerconnect-frontend
          npm run build

  deploy-to-azure-static-web-app:
    name: Deploy to Azure Static Web App
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build and Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "lawyerconnect-frontend"
          api_location: ""
          output_location: ".next"
